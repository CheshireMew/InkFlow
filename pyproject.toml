[project]
name = "inkflow"
dynamic = ["version"]
description = "Cross-platform writing handoff and prompt experiment workbench"
authors = [{ name = "InkFlow Team" }]
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13.0",
    "fastapi>=0.104.0",
    "keyring>=25.0",
    "platformdirs>=4.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "sqlalchemy>=2.0.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
inkflow = "inkflow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inkflow"]

[tool.hatch.version]
path = "src/inkflow/__about__.py"

[tool.hatch.build.targets.wheel.force-include]
"frontend/dist" = "inkflow/frontend_dist"
"src/inkflow/prompt_files" = "inkflow/prompt_files"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
